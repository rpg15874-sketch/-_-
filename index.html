<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>주택임대차 계약 작성</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">GitHub Pages · 계약 작성 · 태블릿 서명</div><h1>주택임대차 계약서</h1></div>
  </header>
  <main class="layout">
    <section class="editor-column">
      <div class="card introduction">
        <div><strong>계약 내용을 작성하세요</strong><p>PC에서 작성한 내용이 태블릿에 실시간으로 나타나고, 제출한 서명도 바로 반영됩니다.</p></div>
      </div>

      <!-- 주소 검색 및 자동완성 UI -->
      <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px;">
        <label for="searchAddress" style="font-weight: bold; display: block; margin-bottom: 8px;">토지 정보 자동 불러오기</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="searchAddress" placeholder="예: 통영시 도남동 123" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
          <button type="button" id="btnSearchLand" style="padding: 8px 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold;">조회 및 자동완성</button>
        </div>
        <p id="searchResultMsg" style="margin-top: 8px; font-size: 13px; margin-bottom: 0;"></p>
      </div>

      <form id="contractForm" autocomplete="off">
        <details open class="form-section">
          <summary><span class="step">1</span><span><strong>주택 및 계약 정보</strong><small>임차주택, 계약 종류, 기간</small></span></summary>
          <div class="form-grid">
            <label class="wide">임차주택 소재지<input data-field="propertyAddress" placeholder="도로명주소" /></label>
            <label>토지 지목<input data-field="landType" /></label><label>토지 면적 (㎡)<input data-field="landArea" inputmode="decimal" /></label>
            <label>건물 구조·용도<input data-field="buildingStructure" /></label><label>건물 면적 (㎡)<input data-field="buildingArea" inputmode="decimal" /></label>
            <label>임차할 부분<input data-field="rentalPart" placeholder="동·층·호 등" /></label><label>임차 부분 면적 (㎡)<input data-field="rentalArea" inputmode="decimal" /></label>
          </div>
        </details>
      </form>
    </section>
  </main>
  
  <script type="module" src="app.js"></script>
</body>
</html>
